name: Publish npm with OIDC
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'jengros/redmine-mcp-server' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.17.0
      - name: Validate release identity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(p.name, '@jengros/redmine-mcp-server');
          assert.match(p.version, /^\d+\.\d+\.\d+$/);
          assert.equal(process.env.GITHUB_REF_NAME, `v${p.version}`);
          assert.equal(p.repository.url, 'git+https://github.com/jengros/redmine-mcp-server.git');
          assert.equal(p.publishConfig.access, 'public');
          assert.equal(p.publishConfig.registry, 'https://registry.npmjs.org/');
          assert.notEqual(p.private, true);
          NODE
      - run: pnpm install --frozen-lockfile
      # prepublishOnly builds and tests; failure prevents publication.
      - name: Publish with GitHub OIDC
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org
      - name: Verify published version
        shell: bash
        run: |
          PACKAGE=$(node -p "const p=require('./package.json'); p.name+'@'+p.version")
          # Registry metadata may lag behind a successful publish. Retry reads only.
          for attempt in 1 2 3 4 5 6; do
            if npm view "$PACKAGE" name version bin dist.attestations --json --registry=https://registry.npmjs.org; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 15; fi
          done
          exit 1
